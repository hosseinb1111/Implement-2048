<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#faf8ef" id="theme-color">
  <meta name="color-scheme" content="light dark">
  <title>2048</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- CUSTOM CURSOR -->
  <div class="cursor-dot" id="cursor-dot" aria-hidden="true"></div>
  <div class="cursor-ring" id="cursor-ring" aria-hidden="true"></div>

  <!-- THEME TOGGLE -->
  <button type="button" class="theme-btn interactive" id="theme-btn"
          aria-label="Switch to dark theme" title="Switch to dark theme">🌙</button>

  <main class="app">

    <!-- HEADER -->
    <header class="header">
      <h1 class="title">2048</h1>
      <div class="scores">
        <div class="score-box" id="score-box">
          <span class="score-label">SCORE</span>
          <span class="score-value" id="score">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">BEST</span>
          <span class="score-value" id="best">0</span>
        </div>
      </div>
    </header>

    <!-- BOARD -->
    <div class="board" id="board" role="application" aria-label="2048 game board"
         aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight W A S D">

      <!-- GRID CELLS -->
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>

      <!-- TILE LAYER -->
      <div class="tiles" id="tiles" aria-hidden="true"></div>

      <!-- MESSAGE -->
      <div class="message" id="message" aria-live="polite">
        <p class="message-text" id="message-text">Game Over!</p>
        <div class="message-buttons">
          <button type="button" class="btn" id="message-btn">Try Again</button>
          <button type="button" class="btn secondary" id="continue-btn" hidden>Keep Going</button>
        </div>
      </div>

    </div>

    <!-- CONTROLS -->
    <div class="controls">
      <button type="button" class="btn interactive" id="new-game">New Game</button>
      <button type="button" class="btn secondary interactive" id="undo" disabled>Undo</button>
    </div>

    <!-- HINT -->
    <p class="hint">Swipe or use Arrow Keys / WASD</p>

    <!-- CREDIT -->
    <p class="credit">
      <span>Created with</span>
      <span class="heart" role="img" aria-label="love">❤️</span>
      <span>&amp;</span>
      <span class="coffee" role="img" aria-label="coffee">☕</span>
      <span>by</span>
      <span class="credit-name">Hossein Seyed Bagheri</span>

      <a class="github-link interactive"
         href="https://github.com/hosseinb1111/Random-Adventure-Generator"
         target="_blank" rel="noopener noreferrer"
         aria-label="View project on GitHub" title="View on GitHub">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
    </p>

  </main>

  <script src="script.js"></script>
</body>
</html>
