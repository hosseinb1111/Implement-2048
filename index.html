<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2048 Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* --- Global Reset & Layout --- */
        :root {
            --bg-color: #faf8ef;
            --grid-color: #bbada0;
            --cell-color: #cdc1b4;
            --text-dark: #776e65;
            --text-light: #f9f6f2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            touch-action: none; /* Prevent browser scroll */
        }

        /* --- Header & Score --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 2.5rem;
            line-height: 1.2;
        }

        .score-container {
            background: var(--grid-color);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            min-width: 100px;
        }

        .score-label { font-size: 0.6rem; display: block; margin-bottom: 5px; }
        .score-value { font-size: 1.2rem; }

        /* --- Game Board --- */
        .game-container {
            position: relative;
            background: var(--grid-color);
            padding: 15px;
            border-radius: 10px;
            width: 400px;
            height: 400px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 15px;
            touch-action: none;
        }

        /* Background Cells */
        .grid-cell {
            background: var(--cell-color);
            border-radius: 6px;
            width: 100%;
            height: 100%;
        }

        /* Foreground Tiles */
        .tile {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-weight: bold;
            font-size: 2rem;
            transition: transform 0.15s ease-in-out;
            z-index: 10;
            animation: pop 0.2s ease-out;
        }

        @keyframes pop {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        /* Tile Colors by Value */
        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 1.5rem; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 1.5rem; }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 1.5rem; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 1.2rem; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 1.2rem; }

        /* --- Controls & Status --- */
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            background: #8f7a66;
            color: white;
            border: none;
            padding: 10px 20px;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.7rem;
            transition: background 0.2s;
        }

        button:hover { background: #7f6a56; }

        .game-message {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(238, 228, 218, 0.73);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 20;
            border-radius: 10px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .game-message.active { opacity: 1; pointer-events: auto; }
        .game-message p { font-size: 1.5rem; margin-bottom: 20px; }

        /* Responsive */
        @media (max-width: 450px) {
            .game-container { width: 300px; height: 300px; padding: 10px; gap: 10px; }
            .tile { font-size: 1.5rem; }
            .title { font-size: 1.8rem; }
            .score-container { min-width: 80px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">2048</div>
        <div class="score-container">
            <span class="score-label">SCORE</span>
            <span class="score-value" id="score">0</span>
        </div>
    </div>

    <div class="game-container" id="game-container">
        <!-- Background Grid Cells -->
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>

        <!-- Game Message Overlay -->
        <div class="game-message" id="game-message">
            <p id="game-message-text">Game Over!</p>
            <button onclick="initGame()">Try Again</button>
        </div>
    </div>

    <div class="controls">
        <button onclick="initGame()">New Game</button>
        <span style="font-size: 0.6rem;">Swipe or Arrow Keys</span>
    </div>

    <script>
        // --- Configuration & State ---
        const SIZE = 4;
        const SCORE_EL = document.getElementById('score');
        const MESSAGE_EL = document.getElementById('game-message');
        const MESSAGE_TEXT = document.getElementById('game-message-text');
        const CONTAINER = document.getElementById('game-container');

        let grid = [];
        let score = 0;
        let gameOver = false;

        // --- Initialization ---
        function initGame() {
            grid = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
            score = 0;
            gameOver = false;
            updateScore();
            clearTiles();
            addRandomTile();
            addRandomTile();
            renderTiles();
            MESSAGE_EL.classList.remove('active');
        }

        // --- Core Logic ---

        function addRandomTile() {
            const emptyCells = [];
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c] === 0) emptyCells.push({r, c});
                }
            }
            if (emptyCells.length > 0) {
                const {r, c} = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                grid[r][c] = Math.random() < 0.9 ? 2 : 4;
            }
        }

        function slideRow(row) {
            let arr = row.filter(val => val);
            let missing = SIZE - arr.length;
            let zeros = Array(missing).fill(0);
            arr = arr.concat(zeros);

            for (let i = 0; i < SIZE - 1; i++) {
                if (arr[i] !== 0 && arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr[i + 1] = 0;
                }
            }

            arr = arr.filter(val => val);
            missing = SIZE - arr.length;
            zeros = Array(missing).fill(0);
            arr = arr.concat(zeros);
            return arr;
        }

        function canMove() {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c] === 0) return true;
                    if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) return true;
                    if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) return true;
                }
            }
            return false;
        }

        function move(direction) {
            if (gameOver) return;
            let moved = false;
            let newGrid = JSON.parse(JSON.stringify(grid));

            if (direction === 'left' || direction === 'right') {
                for (let r = 0; r < SIZE; r++) {
                    let row = newGrid[r];
                    if (direction === 'right') row.reverse();
                    let newRow = slideRow(row);
                    if (direction === 'right') newRow.reverse();
                    newGrid[r] = newRow;
                }
            } else { 
                for (let c = 0; c < SIZE; c++) {
                    let col = [];
                    for (let r = 0; r < SIZE; r++) col.push(newGrid[r][c]);
                    if (direction === 'down') col.reverse();
                    let newCol = slideRow(col);
                    if (direction === 'down') newCol.reverse();
                    for (let r = 0; r < SIZE; r++) newGrid[r][c] = newCol[r];
                }
            }

            if (JSON.stringify(grid) !== JSON.stringify(newGrid)) {
                grid = newGrid;
                addRandomTile();
                updateScore();
                renderTiles();
                if (!canMove()) {
                    gameOver = true;
                    MESSAGE_TEXT.textContent = "Game Over!";
                    MESSAGE_EL.classList.add('active');
                }
            }
        }

        // --- Rendering ---
        function clearTiles() {
            const tiles = document.querySelectorAll('.tile');
            tiles.forEach(t => t.remove());
        }

        function renderTiles() {
            clearTiles();
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const val = grid[r][c];
                    if (val > 0) {
                        const tile = document.createElement('div');
                        tile.classList.add('tile', `tile-${val}`);
                        tile.textContent = val;
                        const cell = document.querySelectorAll('.grid-cell')[r * SIZE + c];
                        const rect = cell.getBoundingClientRect();
                        const containerRect = CONTAINER.getBoundingClientRect();
                        
                        tile.style.left = rect.left - containerRect.left + 'px';
                        tile.style.top = rect.top - containerRect.top + 'px';
                        tile.style.width = rect.width + 'px';
                        tile.style.height = rect.height + 'px';
                        
                        CONTAINER.appendChild(tile);
                    }
                }
            }
        }

        function updateScore() {
            SCORE_EL.textContent = score;
        }

        // --- Input Handling ---
        document.addEventListener('keydown', (e) => {
            if (gameOver) return;
            switch(e.key) {
                case 'ArrowUp': move('up'); break;
                case 'ArrowDown': move('down'); break;
                case 'ArrowLeft': move('left'); break;
                case 'ArrowRight': move('right'); break;
            }
        });

        // Touch Handling for Mobile
        let touchStartX = 0;
        let touchStartY = 0;

        CONTAINER.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, {passive: false});

        CONTAINER.addEventListener('touchmove', (e) => {
            e.preventDefault(); // Prevent scrolling
        }, {passive: false});

        CONTAINER.addEventListener('touchend', (e) => {
            if (gameOver) return;
            let touchEndX = e.changedTouches[0].clientX;
            let touchEndY = e.changedTouches[0].clientY;
            
            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;
            let threshold = 30; // Minimum swipe distance

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > threshold) {
                    if (diffX > 0) move('right');
                    else move('left');
                }
            } else {
                if (Math.abs(diffY) > threshold) {
                    if (diffY > 0) move('down');
                    else move('up');
                }
            }
        }, {passive: false});

        window.onload = initGame;
    </script>
</body>
</html>
